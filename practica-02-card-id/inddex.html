<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Estudiantil</title>
    <!-- Google Fonts & Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

    <main class="container">
        <!-- Tarjeta de Identificación Minimalista Estilo Pasaporte -->
        <div class="id-card" id="idCard">
            <!-- Cabecera -->
            <div class="card-header">
                <span class="header-title">Identificación Estudiantil</span>
                <span class="header-subtitle">Documento Oficial</span>
            </div>

            <!-- Cuerpo de la Tarjeta -->
            <div class="card-body">
                <!-- Foto de identificación -->
                <div class="photo-container">
                    <div class="photo-placeholder" id="photoPlaceholder">
                        <span class="material-icons photo-icon">person</span>
                    </div>
                </div>

                <!-- Datos Personales -->
                <div class="user-info">
                    <h1 class="user-name">Natalia Marisol Reyes Vallejo</h1>
                    <p class="user-role">Ingeniería en Sistemas Computacionales</p>
                    <p class="user-id">ID: <span id="userId">13301723</span></p>
                </div>

                <!-- Divisor Minimalista -->
                <hr class="divider">

                <!-- Detalles / Metadatos -->
                <div class="meta-grid">
                    <div class="meta-item">
                        <span class="meta-label">Fecha de Nacimiento</span>
                        <span class="meta-value">07/02/2003</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Estatus</span>
                        <span class="meta-value">Estudiante Activo</span>
                    </div>
                </div>
            </div>

            <!-- Pie de Tarjeta / Acciones -->
            <div class="card-footer">
                <div class="code-container">
                    <span class="material-icons qr-icon">qr_code_2</span>
                    <span class="code-text">Documento Verificado</span>
                </div>
                <button class="action-btn" id="shareBtn" aria-label="Copiar ID" title="Copiar ID">
                    <span class="material-icons">content_copy</span>
                </button>
            </div>
        </div>

        <!-- Notificación Toast -->
        <div class="toast" id="toast">ID copiado al portapapeles</div>
    </main>

    <!-- Script -->
    <script src="./script.js"></script>
</body>
</html>
